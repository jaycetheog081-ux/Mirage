name: Build Mirage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirage-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mirage
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Select Xcode
        run: |
          set -euo pipefail

          xcodebuild -version
          xcode-select -p

      - name: Validate Project Files
        run: |
          set -euo pipefail

          test -f project.yml || {
            echo "::error::project.yml is missing."
            exit 1
          }

          test -d MirageApp || {
            echo "::error::MirageApp directory is missing."
            exit 1
          }

          test -d MirageCore || {
            echo "::error::MirageCore directory is missing."
            exit 1
          }

      - name: Generate Xcode Project
        run: |
          set -euo pipefail

          xcodegen generate --spec project.yml

          xcodebuild \
            -list \
            -project Mirage.xcodeproj

      - name: Build iOS Simulator App
        run: |
          set -euo pipefail

          xcodebuild \
            -project Mirage.xcodeproj \
            -scheme Mirage \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/MirageSimulatorBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS Device App
        run: |
          set -euo pipefail

          xcodebuild \
            -project Mirage.xcodeproj \
            -scheme Mirage \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MirageDeviceBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/MirageDeviceBuild/Build/Products/Release-iphoneos/Mirage.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Mirage.app was not produced."
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Mirage.app

          /usr/bin/zip -qry Mirage-unsigned.ipa Payload

          rm -rf Payload

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mirage-Build
          if-no-files-found: error
          path: |
            Mirage-unsigned.ipa
            ${{ runner.temp }}/MirageSimulatorBuild/Build/Products/Debug-iphonesimulator/Mirage.app
