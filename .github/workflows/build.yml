name: Build Mirage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirage-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail

          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -n 1)"

          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode installation was found."
            exit 1
          fi

          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

          xcodebuild -version
          xcodegen --version

      - name: Validate Project Configuration
        run: |
          set -euo pipefail

          if [ ! -f project.yml ]; then
            echo "::error::project.yml was not found in the repository root."
            exit 1
          fi

          if [ ! -d MirageApp ]; then
            echo "::error::MirageApp directory was not found."
            exit 1
          fi

          if [ ! -d MirageCore ]; then
            echo "::error::MirageCore directory was not found."
            exit 1
          fi

      - name: Generate Xcode Project
        run: |
          set -euo pipefail

          xcodegen generate --spec project.yml

          if [ ! -d Mirage.xcodeproj ]; then
            echo "::error::XcodeGen did not create Mirage.xcodeproj."
            exit 1
          fi

      - name: Build iOS Simulator App
        run: |
          set -euo pipefail

          xcodebuild \
            -project Mirage.xcodeproj \
            -scheme Mirage \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/MirageSimulatorBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Device App
        run: |
          set -euo pipefail

          xcodebuild \
            -project Mirage.xcodeproj \
            -scheme Mirage \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MirageDeviceBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/MirageDeviceBuild/Build/Products/Release-iphoneos/Mirage.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Mirage.app was not produced by the device build."
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Mirage.app
          /usr/bin/zip -qry Mirage-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mirage-iOS-Build
          if-no-files-found: error
          path: |
            Mirage-unsigned.ipa
            ${{ runner.temp }}/MirageSimulatorBuild/Build/Products/Debug-iphonesimulator/Mirage.app
